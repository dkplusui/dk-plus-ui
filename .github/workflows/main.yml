name: DK plus Ui Github Actions

# 当 master 分支 push 代码的时候触发 workflow
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 下载仓库代码 / 校验
      - name: Checkout
        # actions/checkout@v3 是 github 官方的一个action，用于 clone 该仓库的源码到工作流中
        uses: actions/checkout@v3

      # 安装 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 7.18.2

      # 安装 node
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
          cache: 'pnpm'

      # 安装依赖项
      - name: Install
        run: pnpm install

      - name: Build(docs)
        run: npm run build:docs

      # play 的构建产物只发布到 dev 站点（见下方注释掉的步骤），dev 停用后不再需要构建
      # - name: Build(play)
      #   run: npm run build:play

      # dev 站点（test.cadwaladerss.com）已下线，暂时停用。
      # 需要恢复时把下面两段取消注释即可。
      # - name: Clear existing files (dev)
      #   run: |
      #     mkdir -p ~/.ssh
      #     # keyscan 只用于免掉首次连接的主机确认，取不到密钥不应中断部署
      #     ssh-keyscan -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      #     echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
      #     chmod 600 ~/.ssh/id_rsa
      #     ssh -p ${{ secrets.REMOTE_PORT }} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "rm -rf /www/wwwWeb/test.cadwaladerss.com/*"

      # - name: Deploy to Web Server (dev)
      #   uses: easingthemes/ssh-deploy@v2
      #   with:
      #     SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      #     REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      #     REMOTE_USER: ${{ secrets.REMOTE_USER }}
      #     REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
      #     SOURCE: /play/dist/*
      #     TARGET: /www/wwwWeb/test.cadwaladerss.com

      # 部署前自检：只读，不会让流水线失败。
      # 把 SSH 连接结果与目标目录状态打出来，用于区分认证失败 / 端口不通 / 目录权限不足。
      - name: Diagnose deploy access
        id: diagnose
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "target host=${{ secrets.REMOTE_HOST }} port=${{ secrets.REMOTE_PORT }} user=${{ secrets.REMOTE_USER }}"
          OUT=$(ssh -p ${{ secrets.REMOTE_PORT }} -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            "id -un; id -u; ls -ld /www/wwwWeb/dk-plus.com | awk '{print \$1, \$3, \$4}'; test -w /www/wwwWeb/dk-plus.com && echo W=YES || echo W=NO; rm -rf /www/wwwWeb/dk-plus.com/__ci_probe_nonexistent__; echo PROBE=\$?" 2>&1 || true)
          echo "$OUT" | tail -30
          echo "::error title=Deploy access check::$(echo "$OUT" | tr '\n' ' ' | cut -c1-900)"
          mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics"
          printf '%s\n' "$OUT" > "$GITHUB_WORKSPACE/ci-diagnostics/deploy-access.txt"
          printf 'host=%s port=%s user=%s\n' "${{ secrets.REMOTE_HOST }}" "${{ secrets.REMOTE_PORT }}" "${{ secrets.REMOTE_USER }}" > "$GITHUB_WORKSPACE/ci-diagnostics/target.txt"
          # 诊断结论写进 step output 与 artifact 名称，不登录也能从运行列表直接看到
          SUMMARY=$(echo "$OUT" | tr '\n' ' ' | tr -d '"<>|*/\\:' | tr -s ' ' | cut -c1-180)
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$SUMMARY" > "$GITHUB_WORKSPACE/ci-diagnostics/summary.txt"
          echo "SUMMARY=$SUMMARY"

      - name: Publish deploy diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics-${{ steps.diagnose.outputs.summary }}
          path: ci-diagnostics/
          retention-days: 1

      - name: Clear existing files (master)
        run: |
          mkdir -p ~/.ssh
          # keyscan 只用于免掉首次连接的主机确认，取不到密钥不应中断部署
          ssh-keyscan -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          OUT=$(ssh -p ${{ secrets.REMOTE_PORT }} -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            "rm -rf /www/wwwWeb/dk-plus.com/*" 2>&1) || {
              echo "::error title=Deploy cleanup failed::$(echo "$OUT" | tr '\n' ' ' | cut -c1-900)"
              exit 1
            }
          echo "$OUT"

      - name: Deploy to Web Server (master)
        uses: easingthemes/ssh-deploy@v2
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          SOURCE: /docs/.vitepress/dist/*
          TARGET: /www/wwwWeb/dk-plus.com

      - name: Deploy to Web electronicBook (master)
        uses: easingthemes/ssh-deploy@v2
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          SOURCE: /docs/assets/electronicBook/*
          TARGET: /www/wwwWeb/dk-plus.com/assets/electronicBook/

      - name: Deploy to robots Server (master)
        uses: easingthemes/ssh-deploy@v2
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          SOURCE: /docs/seo/*
          TARGET: /www/wwwWeb/dk-plus.com
